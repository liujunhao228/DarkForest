[project]
name = "darkforest-analyser"
version = "0.1.0"
description = "基于 CrewAI 的 Map-Reduce 复盘分析流水线：从本地 SQLite 读取回放，经 mcpserver 全知视角语义投影，产出复盘报告 + 策略评估"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.80",
    "mcp>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
# entry point 指向 Typer 实例 app：单命令 Typer 经 get_command 展开为
# TyperCommand（非 Group），`analyser <replay_id>` 无需子命令即可直达。
analyser = "darkforest_analyser.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
strict = true
packages = ["darkforest_analyser"]

[[tool.mypy.overrides]]
module = ["crewai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
