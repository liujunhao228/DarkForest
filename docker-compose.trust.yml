# ============================================================
# 黑暗森林 - LOCAL_TRUST_MODE 本地一键编排（SQLite 版）
# ============================================================
#
# 启动：  docker compose -f docker-compose.trust.yml up -d --build
# 日志：  docker compose -f docker-compose.trust.yml logs -f
# 停止：  docker compose -f docker-compose.trust.yml down
# 重置：  docker compose -f docker-compose.trust.yml down -v
#
# ============================================================
# 为什么必须用 host 网络模式（设计硬约束，不可改）
# ============================================================
# backend 的 trust handler（backend/internal/hub/handler_trust.go）硬编码
# 仅放行来源 IP 为 127.0.0.1 / ::1 的 /ws 连接，否则 403。
#
# Docker 默认 bridge 网络下，宿主进程经端口映射连容器时，容器看到的源 IP
# 是 docker-proxy 的网关 IP（如 172.x.x.1），不是 127.0.0.1，会被拒绝。
# 唯一不改 backend 源码的解法是 host 网络模式：容器直接共享宿主网络栈，
# 宿主侧 bot 连 127.0.0.1:8080 时，backend 看到的 RemoteAddr 就是 127.0.0.1。
#
# ============================================================
# 网络拓扑（2026-08-16 起：PostgreSQL 已移除，backend 内嵌 SQLite）
# ============================================================
#   ┌─ 宿主 ─────────────────────────────────────────────┐
#   │  bot (Python, 8081) ──ws://127.0.0.1:8080/ws──┐    │
#   │  SnowLuma ──反向WS── bot:8081                 ││    │
#   └──────────────────────────────────────────────┼┼────┘
#   ┌─ docker compose (全部 host 网络) ─────────────┼┼───┐
#   │  backend   :8080  ← bot/宿主连 127.0.0.1:8080 ┘   │
#   │     └ SQLite 文件卷 /data/darkforest.db            │
#   │  mcpserver :9090  (network_mode: service:backend)  │
#   │     └ GAME_API_URL=http://127.0.0.1:8080          │
#   │     └ GAME_WS_URL =ws://127.0.0.1:8080/ws         │
#   └────────────────────────────────────────────────────┘
#
# ============================================================
# 平台说明
# ============================================================
# - Linux：原生支持 host 网络模式，推荐此方案。
# - Windows Docker Desktop：需 4.34+ 并在设置中启用 host 网络实验特性
#   （Settings → Resources → Network → Enable host networking）。
#   若不可用，本地开发请直接 go run ./cmd/server + uv run darkforest-bot，
#   不必走 Docker。
# - macOS：Docker Desktop 4.34+ 同样实验性支持，行为与 Linux 对齐。
#
# ============================================================
# 端口占用（host 网络下端口直接是宿主端口，请确保未被占用）
# ============================================================
# 8080  backend (HTTP + WebSocket)
# 9090  mcpserver (MCP Streamable HTTP)
#
# 本地信任模式不需要 JWT_SECRET / ADMIN_SECRET_KEY（已标 deprecated）。
# bot / SnowLuma 留宿主侧运行（bot/AGENTS.md 既定方案）。
# ============================================================

services:
  # -------------------- Go 后端（trust 模式，内嵌 SQLite）--------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.trust
    container_name: darkforest-trust-backend
    restart: unless-stopped
    network_mode: host
    environment:
      # SQLite 文件落在 /data 卷；backend 启动时自动执行迁移
      DATABASE_URL: "sqlite:///data/darkforest.db"
      MIGRATIONS_DIR: "/app/migrations"
      STATIC_DIR: "/app/static"
      PORT: "8080"
      ENVIRONMENT: "development"
      LOCAL_TRUST_MODE: "1"
      # trust 模式下 CORS 无关紧要（仅 bot/mcpserver 经 127.0.0.1 连）；
      # development 默认即放行 *，无需显式设
    volumes:
      - trust_backend_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s

  # -------------------- MCP Server（AI 代理接入，可选）--------------------
  # 仅当需要 AI 代理（agent:<sid>）接入时启动；纯 QQbot 对局不需要此服务。
  # 用 network_mode: service:backend 共享 backend 的 host 网络命名空间，
  # 从而经 127.0.0.1:8080 连 backend /ws，满足 trust handler 的 localhost 校验。
  mcpserver:
    build:
      context: ./mcpserver
      dockerfile: Dockerfile
    container_name: darkforest-trust-mcpserver
    restart: unless-stopped
    network_mode: "service:backend"
    environment:
      LOCAL_TRUST_MODE: "1"
      # 共享 backend 网络栈，用 127.0.0.1 直连 backend
      GAME_API_URL: "http://127.0.0.1:8080"
      GAME_WS_URL: "ws://127.0.0.1:8080/ws"
      MCP_PORT: "9090"
      MCP_ENDPOINT: "/mcp"
      DB_PATH: "/data/mcpserver.db"
      # 首启播种 agent 名单：逗号分隔，每项 sid 或 sid:昵称（昵称缺省回退 AI-<sid>）
      # 幂等，重建容器不重复建。可由宿主环境变量 AGENT_SEED_NAME 覆盖（统一启动脚本据此派生）。
      AGENT_SEED_NAME: "${AGENT_SEED_NAME:-ai1:AgentOne,ai2:AgentTwo,ai3:AgentThree,ai4:AgentFour,ai5:AgentFive,ai6:AgentSix,ai7:AgentSeven,ai8:AgentEight,ai9:AgentNine,ai10:AgentTen,ai11:AgentEleven,ai12:AgentTwlve}"
    volumes:
      - trust_mcpserver_data:/data
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# -------------------- 持久化卷 --------------------
# host 网络模式下不需要 networks 定义（所有容器直接用宿主网络）
volumes:
  trust_backend_data:
    name: darkforest-trust-backend-data
    driver: local
  trust_mcpserver_data:
    name: darkforest-trust-mcpserver-data
    driver: local
