name: Trust Integration E2E

on:
  push:
    paths:
      - 'backend/**'
      - 'mcpserver/**'
    branches:
      - main
  pull_request:
    paths:
      - 'backend/**'
      - 'mcpserver/**'
    branches:
      - main
  workflow_call:

jobs:
  trust-e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trust
          POSTGRES_PASSWORD: trust
          POSTGRES_DB: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trust"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 供 make trust-e2e 的集成 harness 使用(harness 会把该值注入 trust backend 子进程)
      DATABASE_URL: postgres://trust:trust@localhost:5432/trust?sslmode=disable

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download backend deps
        run: go mod download

      - name: Download mcpserver deps
        working-directory: mcpserver
        run: go mod download

      - name: Build backend
        run: go build ./...

      - name: Build mcpserver
        working-directory: mcpserver
        run: go build ./...

      - name: Backend unit tests
        run: go test ./... -count=1

      - name: mcpserver unit tests
        working-directory: mcpserver
        run: go test ./... -count=1

      - name: Backend gofmt check
        run: |
          fmt_output=$(gofmt -l .)
          if [ -n "$fmt_output" ]; then
            echo "以下文件格式不正确:"
            echo "$fmt_output"
            exit 1
          fi

      - name: mcpserver gofmt check
        working-directory: mcpserver
        run: |
          fmt_output=$(gofmt -l .)
          if [ -n "$fmt_output" ]; then
            echo "以下文件格式不正确:"
            echo "$fmt_output"
            exit 1
          fi

      - name: Trust integration e2e (make trust-e2e)
        run: make trust-e2e
